<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,
        initial-scale=1.0"
    />
    <title>
      Урок информатики | Египетская
      система счисления
    </title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <header id="home">
      <h1>Урок информатики</h1>
      <nav
        aria-label="Основная навигация"
      >
        <ul>
          <li>
            <a href="#home">Главная</a>
          </li>
          <li>
            <a href="#articles"
              >Статьи</a
            >
          </li>
          <li>
            <a href="#about"
              >Об уроке</a
            >
          </li>
          <li>
            <button
              class="theme-btn"
              id="themeBtn"
              aria-pressed="false"
            >
              Тёмная тема
            </button>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <section id="articles">
        <h2>
          Египетская система счисления
        </h2>
        <div class="search-container">
          <label for="searchInput">
            Поиск по статьям
          </label>
          <input
            type="search"
            id="searchInput"
            aria-label="Поиск статей"
            placeholder="Поиск"
          />
        </div>
        <div
          id="postsContainer"
          aria-live="polite"
        ></div>
      </section>
      <aside id="about">
        <h3>Об уроке</h3>
        <p>
          Урок информатики по теме
          «Египетская система
          счисления».
        </p>
        <h3>Домашнее задание</h3>
        <p>
          Запишите египетскими знаками
          число 1234.
        </p>
        <dl class="number-key">
          <div>
            <dt>1</dt>
            <dd>Палочка</dd>
          </div>
          <div>
            <dt>10</dt>
            <dd>Дуга</dd>
          </div>
          <div>
            <dt>100</dt>
            <dd>Верёвка</dd>
          </div>
          <div>
            <dt>1000</dt>
            <dd>Лотос</dd>
          </div>
        </dl>
      </aside>
    </main>
    <footer>
      <p>
        © 2026 Злата. Урок информатики.
      </p>
    </footer>
    <script
      src="js/main.js"
      type="module"
    ></script>
  </body>
</html>
